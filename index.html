<style>
  :root{
    --ink:#091310; --ink-soft:#101C18; --paper:#F3F4F0; --paper-dim:#C9CFC7;
    --moss:#0B7F58; --sage:#6CAC97; --mint:#A8E6D1;
    --line: rgba(243,244,240,0.14); --line-strong: rgba(243,244,240,0.28);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  body{
    min-height:100vh; min-height:100dvh;
    background:var(--ink); color:var(--paper);
    font-family:'Inter', sans-serif; line-height:1.45; overflow-x:hidden;
  }
  h1,.lk b,.soc-n{ font-family:'Instrument Sans', sans-serif; font-weight:600; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }

  .bg-scene{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bg-scene::before{
    content:""; position:absolute; inset:-10%;
    background:
      radial-gradient(60% 45% at 12% 8%, rgba(11,127,88,0.55), transparent 60%),
      radial-gradient(55% 50% at 92% 18%, rgba(108,172,151,0.22), transparent 65%),
      radial-gradient(70% 55% at 30% 92%, rgba(11,127,88,0.4), transparent 60%),
      radial-gradient(50% 40% at 85% 85%, rgba(168,230,209,0.08), transparent 60%);
    filter: blur(60px); animation: driftScene 26s ease-in-out infinite alternate;
  }
  .bg-scene::after{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(100deg, rgba(243,244,240,0.035) 0px, rgba(243,244,240,0.035) 2px, transparent 2px, transparent 34px);
    mix-blend-mode:overlay; opacity:0.5;
  }
  @keyframes driftScene{ 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(-2.5%,2%) scale(1.06); } }

  .page{
    position:relative; z-index:1; width:100%; max-width:520px; margin:0 auto;
    padding: 0 20px max(40px, env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
  }
  .rise{ animation: rise 0.8s ease backwards; animation-delay: calc(var(--i, 0) * 110ms); }
  @keyframes rise{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:none; } }

  .hero{
    position:relative; z-index:1; width:min(100%, 900px); margin:0 auto;
    height: min(max(66vh, 440px), 900px);
  }
  .hero img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 8%; display:block;
    -webkit-mask-image: linear-gradient(to bottom, #000 52%, rgba(0,0,0,0.55) 74%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 52%, rgba(0,0,0,0.55) 74%, transparent 100%);
    animation: heroIn 1.1s ease backwards;
  }
  @media (min-width:700px){
    .hero img{
      -webkit-mask-image: linear-gradient(to bottom, #000 52%, rgba(0,0,0,0.55) 74%, transparent 100%), linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to bottom, #000 52%, rgba(0,0,0,0.55) 74%, transparent 100%), linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
      mask-composite: intersect;
    }
  }
  @keyframes heroIn{ from{ opacity:0; transform:scale(1.04); } to{ opacity:1; transform:none; } }
  .hero-text{
    position:absolute; left:0; right:0; bottom:18px; padding:0 20px; text-align:center;
    animation: rise 0.9s ease 0.25s backwards;
  }
  h1{ font-size:2rem; line-height:1.1; text-shadow:0 2px 24px rgba(9,19,16,0.8); }
  .role{ margin-top:6px; color:var(--mint); font-size:0.98rem; text-shadow:0 2px 18px rgba(9,19,16,0.8); }

  .socials{ display:flex; justify-content:center; gap:14px; margin-top:6px; width:100%; }
  .soc{
    flex:1 1 0; max-width:140px; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:16px 8px 14px; border-radius:20px; background:var(--ink-soft); border:1px solid var(--line);
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .soc-ic{
    width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    background:rgba(243,244,240,0.07); color:var(--mint);
  }
  .soc-ic svg{ width:23px; height:23px; }
  .soc-n{ font-size:1.25rem; margin-top:4px; }
  .soc-l{ font-size:0.76rem; color:var(--sage); }

  .links{ width:100%; display:flex; flex-direction:column; gap:14px; margin-top:20px; }
  .lk{
    display:flex; align-items:center; gap:14px; padding:12px 16px 12px 12px; min-height:84px;
    border-radius:20px; background:var(--ink-soft); border:1px solid var(--line);
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .lk-media{
    position:relative; flex:none; width:104px; height:62px; border-radius:12px; overflow:hidden;
    background: radial-gradient(80% 70% at 50% 30%, rgba(11,127,88,0.45), var(--ink-soft));
    display:flex; align-items:center; justify-content:center; color:var(--sage);
  }
  .lk-media img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .lk-media.logo img{ position:static; width:44px; height:44px; object-fit:contain; border-radius:10px; }
  .lk-media .ph svg{ width:22px; height:22px; }
  .lk-txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .lk b{ font-size:1.08rem; }
  .lk small{ color:var(--sage); font-size:0.8rem; }
  .lk-go{ flex:none; width:20px; height:20px; color:var(--sage); }

  .soc:active, .lk:active{
    transform:scale(0.98); border-color:var(--mint);
    box-shadow: 0 0 0 1px rgba(168,230,209,0.3), 0 0 30px rgba(168,230,209,0.3);
  }
  .soc:focus-visible, .lk:focus-visible{ outline:none; border-color:var(--mint); box-shadow:0 0 30px rgba(168,230,209,0.3); }
  @media (hover:hover) and (pointer:fine){
    .soc, .lk{ transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
    .soc:hover, .lk:hover{
      transform: translateY(-4px); border-color:var(--mint);
      box-shadow: 0 0 0 1px rgba(168,230,209,0.3), 0 0 32px rgba(168,230,209,0.22), 0 0 90px rgba(11,127,88,0.4);
    }
    .soc:hover .soc-ic{ color:var(--mint); box-shadow:0 0 26px rgba(168,230,209,0.35); }
    .soc-ic{ transition: box-shadow 0.3s ease; }
    .lk-go{ transition: transform 0.3s ease, color 0.3s ease; }
    .lk:hover .lk-go{ transform: translate(3px,-3px); color:var(--mint); }
  }
  @media (max-width:360px){
    .lk-media{ width:84px; }
    h1{ font-size:1.7rem; }
  }

  .mail{
    width:100%; margin-top:18px; display:flex; align-items:center; gap:12px;
    padding:14px; border-radius:20px; background:var(--ink-soft); border:1px solid var(--line);
  }
  .mail-main{
    flex:1; min-width:0; display:flex; align-items:center; gap:14px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .mail-ic{
    flex:none; width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    background:rgba(243,244,240,0.07); color:var(--mint);
  }
  .mail-ic svg{ width:23px; height:23px; }
  .mail-txt{ min-width:0; display:flex; flex-direction:column; gap:2px; }
  .mail-txt small{ color:var(--sage); font-size:0.78rem; }
  .mail-txt b{ font-family:'Instrument Sans', sans-serif; font-weight:600; font-size:1.02rem; overflow-wrap:anywhere; }
  .mail-copy{
    flex:none; padding:10px 16px; border-radius:999px; border:1px solid var(--line-strong); background:transparent;
    font:inherit; font-size:0.85rem; color:var(--paper); cursor:pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .mail-copy:active{ border-color:var(--mint); color:var(--mint); }
  .mail:active{ border-color:var(--mint); box-shadow:0 0 30px rgba(168,230,209,0.3); }
  @media (hover:hover) and (pointer:fine){
    .mail{ transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease; }
    .mail:hover{ transform:translateY(-4px); border-color:var(--mint); box-shadow: 0 0 0 1px rgba(168,230,209,0.3), 0 0 32px rgba(168,230,209,0.22), 0 0 90px rgba(11,127,88,0.4); }
    .mail-copy{ transition: border-color 0.25s ease, color 0.25s ease; }
    .mail-copy:hover{ border-color:var(--mint); color:var(--mint); }
  }
</style>
</head>
